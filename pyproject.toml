[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thebenjami-rerankgain"
version = "0.1.0"
description = "比较重排序前后的排名，计算位置变化幅度与被提升文档的质量分布"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "thebenjami" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://thebenjami.github.io"
Repository = "https://github.com/thebenjami/rerankgain"
Issues = "https://github.com/thebenjami/rerankgain/issues"

[project.scripts]
rerankgain = "rerankgain:main"

[tool.setuptools]
py-modules = ["rerankgain"]
